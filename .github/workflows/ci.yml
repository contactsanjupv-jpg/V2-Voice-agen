name: CI

on:
  push:
  pull_request:

# Read-only token; no repository secrets are used anywhere in this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      # Throwaway services inside the runner. The database name contains "test", which the suite requires
      # (it drops every table when it finishes).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atla
          POSTGRES_PASSWORD: atla
          POSTGRES_DB: atla_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atla -d atla_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Fake, CI-only values. No real provider credentials exist here, so no test can reach Retell, Paddle or SMTP.
      ENV: test
      APP_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DATABASE_URL: postgresql+psycopg://atla:atla@localhost:5432/atla_test
      REDIS_URL: redis://localhost:6379/5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt pip-audit
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Type check (app and tests)
        run: npm run typecheck
      - name: Production build
        run: npm run build -- --webpack
      - name: Dependency audit
        run: npm audit
